# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
env:
  - variable: PODAFUL_FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
  - variable: PODAFUL_FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: RESEND_FROM
    secret: RESEND_FROM
  - variable: SYSTEME_IO_API_KEY
    secret: SYSTEME_IO_API_KEY
  - variable: SYSTEME_IO_BASE_URL
    secret: SYSTEME_IO_BASE_URL
  - variable: SYSTEME_IO_TAG_ID
    secret: SYSTEME_IO_TAG_ID
  - variable: SYSTEME_IO_CUSTOM_FIELD_INVENTORY_SCORE
    secret: SYSTEME_IO_CUSTOM_FIELD_INVENTORY_SCORE
  - variable: SYSTEME_IO_CUSTOM_FIELD_BUSINESS_MATURITY
    secret: SYSTEME_IO_CUSTOM_FIELD_BUSINESS_MATURITY
  - variable: SYSTEME_IO_CUSTOM_FIELD_URGENCY
    secret: SYSTEME_IO_CUSTOM_FIELD_URGENCY
  - variable: SYSTEME_IO_CUSTOM_FIELD_INDUSTRY
    secret: SYSTEME_IO_CUSTOM_FIELD_INDUSTRY
  - variable: SYSTEME_IO_CUSTOM_FIELD_EMPLOYEES
    secret: SYSTEME_IO_CUSTOM_FIELD_EMPLOYEES
  - variable: SYSTEME_IO_CUSTOM_FIELD_INVENTORY_METHOD
    secret: SYSTEME_IO_CUSTOM_FIELD_INVENTORY_METHOD
  - variable: SYSTEME_IO_CUSTOM_FIELD_WEAKEST_CATEGORY
    secret: SYSTEME_IO_CUSTOM_FIELD_WEAKEST_CATEGORY
  - variable: SYSTEME_IO_CUSTOM_FIELD_RECOMMENDED_SOFTWARE
    secret: SYSTEME_IO_CUSTOM_FIELD_RECOMMENDED_SOFTWARE
  - variable: SYSTEME_IO_CUSTOM_FIELD_CONSULTATION_RECOMMENDED
    secret: SYSTEME_IO_CUSTOM_FIELD_CONSULTATION_RECOMMENDED
